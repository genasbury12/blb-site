[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/course/*"
  to = "/membership/"
  status = 301

[[redirects]]
  from = "/course-waitlist/*"
  to = "/membership/"
  status = 301

[[redirects]]
  from = "/group-coaching/*"
  to = "/membership/"
  status = 301

[[redirects]]
  from = "/group-waitlist/*"
  to = "/membership/"
  status = 301

[[redirects]]
  from = "/free-trainings/*"
  to = "/free-masterclass/"
  status = 301

[[redirects]]
  from = "/boss"
  to = "/coaching/"
  status = 301
  force = true

[[redirects]]
  from = "/boss/*"
  to = "/coaching/"
  status = 301
  force = true
