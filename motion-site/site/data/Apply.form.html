<form class="app" data-app novalidate>
<div class="two"><div class="fld"><label class="q" for="fa-n">First name</label><input id="fa-n" type="text" name="First name" autocomplete="given-name" maxlength="120"></div>
<div class="fld"><label class="q" for="fa-e">Email address</label><input id="fa-e" type="text" name="Email" inputmode="email" autocomplete="email" maxlength="200"></div></div>
<div class="fld"><label class="q" for="fa-w">Your website, if you have one</label><input id="fa-w" type="text" name="Website" inputmode="url" maxlength="300"></div>
<fieldset><legend>Where are you in your business right now?</legend><label class="opt"><input type="radio" name="Stage" value="I&rsquo;m thinking about starting a blog."><span>I&rsquo;m thinking about starting a blog.</span></label><label class="opt"><input type="radio" name="Stage" value="I&rsquo;ve started my blog but haven&rsquo;t made money."><span>I&rsquo;ve started my blog but haven&rsquo;t made money.</span></label><label class="opt"><input type="radio" name="Stage" value="I&rsquo;m making some money but want more consistent revenue."><span>I&rsquo;m making some money but want more consistent revenue.</span></label><label class="opt"><input type="radio" name="Stage" value="I have an established business and want to adapt it for the future."><span>I have an established business and want to adapt it for the future.</span></label></fieldset>
<div class="fld"><label class="q" for="fa-b">Tell me a little about yourself and what you&rsquo;ve already built.</label><textarea id="fa-b" name="About and what she has built" maxlength="3000"></textarea></div>
<div class="fld"><label class="q" for="fa-g">What do you want to accomplish?</label><textarea id="fa-g" name="What she wants to accomplish" maxlength="3000"></textarea></div>
<div class="fld"><label class="q" for="fa-s">What type of support are you looking for?</label><textarea id="fa-s" name="Support she is looking for" maxlength="3000"></textarea></div>
<fieldset><legend>Are you financially prepared to explore a premium private coaching and implementation partnership if we&rsquo;re a good fit?</legend><label class="opt"><input type="radio" name="Investment ready" value="Yes"><span>Yes</span></label><label class="opt"><input type="radio" name="Investment ready" value="Not yet"><span>Not yet</span></label></fieldset>
<button type="submit">Submit My Application</button><p class="msg" role="alert"></p>
<p style="margin:0;font:400 14px/1.5 var(--font-body);color:#6E4B5B">Applications are reviewed individually. Submitting an application does not automatically guarantee a private session.</p></form>
