<style>

.mcb-copy{flex:1 1 auto;min-width:0}
.mcb-eyebrow{margin:0 0 6px;font:500 11px/1 'DM Mono',monospace;letter-spacing:0.18em;text-transform:uppercase;color:#A23E66}
.mcb-h{margin:0;font:400 clamp(26px,2.9vw,40px)/1.04 'Instrument Serif',Georgia,serif;color:#3A1C2A;letter-spacing:-0.01em}
.mcb-h em{color:#A23E66}
.mcb-h span{background:linear-gradient(transparent 62%,#E9B9CA 62%,#E9B9CA 92%,transparent 92%)}
.mcb-p{margin:8px 0 0;font:500 15px/1.5 Inter,Arial,sans-serif;color:#4A2F3B;max-width:560px}
.mcb-p b{color:#3A1C2A}
.mcb-act{flex:none;display:flex;flex-direction:column;align-items:center;gap:14px}
.mcb-cd{display:flex;gap:8px}
.mcb-cd div{min-width:62px;background:#FFFCFA;border-radius:12px;padding:9px 6px 8px;text-align:center;box-shadow:0 8px 18px rgba(58,28,42,0.1)}
.mcb-cd b{display:block;font:500 26px/1 'DM Mono',monospace;color:#3A1C2A;font-variant-numeric:tabular-nums}
.mcb-cd span{display:block;margin-top:5px;font:500 9px/1 'DM Mono',monospace;letter-spacing:0.16em;color:#A23E66}
.mcb-btn{display:inline-flex;align-items:center;gap:10px;background:#A23E66;color:#FFFFFF;border-radius:999px;padding:14px 22px;font:600 15px/1 Inter,Arial,sans-serif;text-decoration:none;white-space:nowrap;box-shadow:0 12px 26px rgba(162,62,102,0.3)}
.mcb-btn:hover{background:#3A1C2A}
.mcb-btn:focus-visible{outline:3px solid #3A1C2A;outline-offset:3px}
@media (max-width:980px){.mcb-in{flex-wrap:wrap;justify-content:center;text-align:center}.mcb-copy{flex:1 1 100%;order:2}.mcb-p{margin-left:auto;margin-right:auto}.mcb-tab{order:1;width:160px}.mcb-act{order:3}}
@media (max-width:560px){.mcb{padding:22px 16px}.mcb-tab{display:none}.mcb-cd div{min-width:56px}.mcb-cd b{font-size:22px}}
</style>

<script>
(function(){
  var END=Date.UTC(2026,11,1,4,59,59); /* Mon Nov 30 2026, 11:59:59 PM Eastern */
  var box=document.getElementById('mcb'); if(!box) return;
  function pad(n){return (n<10?'0':'')+n;}
  function set(k,v){var e=box.querySelector('[data-mcb="'+k+'"]'); if(e) e.textContent=pad(v);}
  function tick(){
    var left=END-Date.now();
    if(left<=0){box.style.display='none';return;}
    set('d',Math.floor(left/86400000));set('h',Math.floor(left%86400000/3600000));
    set('m',Math.floor(left%3600000/60000));set('s',Math.floor(left%60000/1000));
    setTimeout(tick,1000);
  }
  tick();
})();
</script>
